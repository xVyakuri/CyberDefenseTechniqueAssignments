---
# ===================================================================
# Import Active Directory
# Make vulnerable users
# Have all vulnerabilities and their corresponding PowerShell Commands
# Add Weak Password Policies
# ===================================================================

- name: Create AD servcice accounts with SPNs (Kerberoastable)
  community.windows.win_domain_user:
    name: "{{ item.username }}"
    password: "{{ item.password }}"
    user_cannot_change_password: false
    password_never_expires: true
    description: "{{ item.description }}"
    path: "{{ item.ou }}"
    state: present
    spn:
      - "{{ item.spn }}"
  loop: "{{ vulnerable_users }}"

- name: Configure vulnerable GPO settings
  ansible.windows.win_shell: |
    Import-Module GroupPolicy
    # Create GPO if missing
    if (-not (Get-GPO -Name "{{ item.name }}" -ErrorAction SilentlyContinue)) {
      New-GPO -Name "{{ item.name }}"
      New-GPLink -Name "{{ item.name }}" -Target "DC=lab,DC=local" -Enforced Yes
    }

    # Set registry value
      Set-GPRegistryValue `
        -Name "{{ item.name }}" `
        -Key "{{ item.key }}" `
        -ValueName "{{ item.value_name }}" `
        -Type "{{ item.type }}" `
        -Value {{ item.value }}

  loop: "{{ vulnerable_gpo_settings }}"

- name: Disable Windows Defender (for lab testing only)
  ansible.windows.win_shell: |
    Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
  failed_when: false

- name: Create computer accounts with unconstrained delegation
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    $computerName = "{{ item }}"
    try {
      Get-ADComputer -Identity $computerName -ErrorAction Stop
    } catch {
      New-ADComputer -Name $computerName -Enabled $true
    }
    # Enable unconstrained delegation (TRUSTED_FOR_DELEGATION)
    Set-ADComputer -Identity $computerName -TrustedForDelegation $true
  loop: "{{ unconstrained_delegation_computers }}"
  failed_when: false

- name: Add weak password policy
  ansible.windows.win_shell: |
    Import-Module ActiveDirectory
    Set-ADDefaultDomainPasswordPolicy -Identity "{{ domain_name }}" `
      -MinPasswordLength 5 `
      -ComplexityEnabled $false `
      -LockoutThreshold 0 `
      -MaxPasswordAge 0
  failed_when: false
